name: Update contribution graph

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution graph
        run: python3 scripts/generate_contributions.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes to contribution graph."
            exit 0
          fi

          git commit -m "chore: update contribution graph"
          git push
