name: Update contribution graph

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution graph
        run: python3 scripts/generate_contributions.py

      - name: Create contribution graph PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update contribution graph"
          title: "chore: update contribution graph"
          body: |
            Automatically generated update to the repository contribution graph.
          branch: automated/contribution-graph
          delete-branch: true
          add-paths: |
            assets/contributions.svg
